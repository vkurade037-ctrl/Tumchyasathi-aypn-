<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>तुमच्यासाठी कायपण</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f5f7fb;color:#222}
.app{max-width:480px;margin:auto;min-height:100vh;background:#fff}
.head{padding:18px;text-align:right}.help{color:#1769aa;font-size:14px}
.hero{text-align:center;padding:25px 20px}
.logo{width:100px;height:100px;border:3px solid #333;border-radius:16px;margin:auto;display:flex;align-items:center;justify-content:center;background:#fafafa;font-weight:bold}
.hero h1{font-size:25px;margin:15px 0 25px}
.card{margin:12px 18px;padding:18px;border-radius:14px;background:#fff;box-shadow:0 2px 10px #0001}
.btn{width:100%;padding:14px;border:0;border-radius:10px;background:#1769aa;color:#fff;font-size:17px;margin-top:10px}
.btn:disabled{opacity:.6}
.secondary{background:#eee;color:#222}.hidden{display:none}
input,select,textarea{width:100%;padding:12px;margin:7px 0 12px;border:1px solid #ccc;border-radius:8px;font-size:16px}
.bottom{position:sticky;bottom:0;background:#fff;border-top:1px solid #ddd;display:flex}
.bottom button{flex:1;padding:14px;border:0;background:#fff;font-size:14px}
.booking{padding:18px}
.success{background:#e9f8ed;padding:15px;border-radius:10px;margin-top:10px}
.error{background:#fdecec;padding:15px;border-radius:10px;margin-top:10px;word-break:break-word}
.info{background:#eef6ff;padding:12px;border-radius:10px;margin:10px 0}
.otpbox{background:#f5f7fb;padding:12px;border-radius:10px;margin-bottom:10px}
.small{font-size:13px;color:#666}
#recaptcha-container{margin:12px 0;min-height:78px}
#otp{letter-spacing:5px;text-align:center;font-weight:bold}
.phone-row{display:flex;gap:8px;align-items:center}
.country-code{
  width:65px;
  padding:12px 8px;
  border:1px solid #ccc;
  border-radius:8px;
  background:#f5f5f5;
  font-size:16px;
  font-weight:bold;
  text-align:center;
}
.phone-input{
  flex:1;
  margin:7px 0 12px;
}
</style>
</head>

<body>
<div class="app">

<div class="head"><span class="help">मदत केंद्र</span></div>

<section id="home" class="hero">
  <div class="logo">BOX</div>
  <h1>तुमच्यासाठी कायपण</h1>
  <div class="card">
    <h3>तुम्हाला काय हवे आहे?</h3>
    <button class="btn" onclick="show('booking')">नवीन बुकिंग</button>
  </div>
</section>

<section id="booking" class="booking hidden">
  <h2>नवीन बुकिंग</h2>

  <label>तुमचे नाव</label>
  <input id="name" placeholder="नाव लिहा">

  <label>मोबाईल नंबर</label>
  <div class="phone-row">
    <div class="country-code">+91</div>
    <input
      id="phone"
      class="phone-input"
      type="tel"
      inputmode="numeric"
      maxlength="10"
      placeholder="10 अंकी मोबाईल नंबर"
    >
  </div>

  <div id="recaptcha-container"></div>

  <button id="sendOtpBtn" class="btn" onclick="sendOTP()">OTP पाठवा</button>

  <div id="otpArea" class="otpbox hidden">
    <label>OTP टाका</label>
    <input id="otp" type="tel" inputmode="numeric" maxlength="6"
           placeholder="6 अंकी OTP">
    <button id="verifyOtpBtn" class="btn" onclick="verifyOTP()">OTP तपासा</button>
    <button class="btn secondary" onclick="sendOTP()">OTP पुन्हा पाठवा</button>
  </div>

  <div id="verified" class="success hidden">
    ✅ मोबाईल नंबर सत्यापित झाला.
  </div>

  <div id="bookingFields" class="hidden">

    <label>सेवा निवडा</label>
    <select id="service">
      <option value="सामान्य डिलिव्हरी">सामान्य डिलिव्हरी</option>
      <option value="तातडीची / Emergency सेवा">तातडीची / Emergency सेवा</option>
      <option value="इतर काम">इतर काम</option>
    </select>

    <label>गाव / स्टॉप निवडा</label>
    <select id="place"></select>

    <label>कामाची माहिती</label>
    <textarea id="details" rows="4" placeholder="काय काम आहे ते लिहा"></textarea>

    <button id="bookBtn" class="btn" onclick="book()">बुकिंग करा</button>
  </div>

  <div id="msg"></div>

  <button class="btn secondary" onclick="show('home')">मागे</button>
</section>

<section id="mybookings" class="booking hidden">
  <h2>माझी बुकिंग</h2>
  <div id="list"></div>
  <button class="btn secondary" onclick="show('home')">मागे</button>
</section>

<div class="bottom">
  <button onclick="show('home')">मुख्यपृष्ठ</button>
  <button onclick="show('mybookings');render()">माझी बुकिंग</button>
  <button onclick="alert('प्रोफाइल सुविधा पुढील आवृत्तीत')">माझा प्रोफाइल</button>
</div>

</div>

<script type="module">
import { initializeApp }
  from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
  getAuth,
  RecaptchaVerifier,
  signInWithPhoneNumber
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import {
  getDatabase, ref, push, set, query,
  orderByChild, equalTo, get
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyA2uXsEr5Bcg6T7z87WRhiLZc7FgIJwuqs",
  authDomain: "tumchyasathi-kaypn.firebaseapp.com",
  databaseURL: "https://tumchyasathi-kaypn-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "tumchyasathi-kaypn",
  storageBucket: "tumchyasathi-kaypn.firebasestorage.app",
  messagingSenderId: "670531502002",
  appId: "1:670531502002:web:92309c8a6ffc0d888aaeab",
  measurementId: "G-WZY6XLJBH6"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);
auth.languageCode = "mr";

const villages = [
["बांबवडे",0],["डोणोली",1.8],["चरण",4.7],["सैदापूर",6.7],
["थेरगाव",8.6],["बच्चे सावर्डे",11.5],["कांदे",12.6],
["चिखली",11.5],["मांगले",14.5],["नाटोली",10.1],
["सागाव",8.5],["सरुड",6],["शिंपे",7.4],["सवते",11.5],
["सावे",8.1],["शिरगाव",12.5],["पाटणे",6.4],["कापशी",9.3],
["शिवारे",11.5],["माणगाव",13],["येळाणे",14.5],["शाहूवाडी",12.5],
["मलकापूर",null],["गोगवे",4.2],["पिशवी",6.2],["साळशी",4.2],
["सुपात्रे",3.6],["परखंदळे",9.2],["शित्तुर",5.6],
["खुटाळवाडी",3.5],["बोरीवडे",9],["पैजारवाडी",7.6],
["आवळी",7.8],["देवाळे",10.2],["शिंदेवाडी",9.9],["बोरपाडळे",13],
["मिठारवाडी",16.5],["शहापूर",15.5],["मोहरे",16.5],["आरळे",14.5],
["सातवे",13.5],["काखे",19.5],["अमतेवाडी",13.5],["वाळकेवाडी",11.5],
["भाडळे",10.5],["भाटशिरगांव",14.5],["सोनावडे",3.5],
["नावली",11.5],["बिऊर",17.5],["सावर्डे खुर्द",11.5]
];

const place = document.getElementById("place");

villages.forEach((item,i)=>{
  const option = document.createElement("option");
  option.value = item[0];
  option.textContent =
    (i+1)+". "+item[0]+
    (item[1] !== null ? " — "+item[1]+" km" : " — अंतर उपलब्ध नाही");
  place.appendChild(option);
});

let confirmationResult = null;
let verifiedPhone = "";
let recaptchaVerifier = null;
let recaptchaWidgetId = null;
let bookingInProgress = false;

window.show = function(id){
  ["home","booking","mybookings"].forEach(x=>{
    document.getElementById(x).classList.add("hidden");
  });
  document.getElementById(id).classList.remove("hidden");
};

function firebaseErrorMessage(e){
  const code = e?.code || "unknown";

  const messages = {
    "auth/invalid-phone-number":"मोबाईल नंबर चुकीच्या स्वरूपात आहे.",
    "auth/too-many-requests":"या नंबरसाठी खूप OTP मागवले आहेत. थोड्या वेळाने पुन्हा प्रयत्न करा.",
    "auth/quota-exceeded":"Firebase SMS quota पूर्ण झाली आहे.",
    "auth/captcha-check-failed":"reCAPTCHA तपासणी अयशस्वी झाली.",
    "auth/invalid-app-credential":"reCAPTCHA/App verification मध्ये समस्या आहे.",
    "auth/app-not-authorized":"हा domain Firebase मध्ये Authorized नाही.",
    "auth/operation-not-allowed":"Firebase मध्ये Phone Authentication चालू केलेले नाही.",
    "auth/network-request-failed":"Internet/network समस्या आहे.",
    "auth/code-expired":"OTP कालबाह्य झाला आहे.",
    "auth/invalid-verification-code":"OTP चुकीचा आहे."
  };

  return (messages[code] || "Firebase कडून OTP पाठवताना अनोखी त्रुटी आली.") +
         "<br><small>Code: "+code+"</small>";
}

async function makeRecaptcha(){
  if(recaptchaVerifier) return;

  recaptchaVerifier = new RecaptchaVerifier(
    auth,
    "recaptcha-container",
    {
      size:"normal",
      callback:()=>{},
      "expired-callback":()=>{
        document.getElementById("msg").innerHTML =
          '<div class="error">reCAPTCHA कालबाह्य झाले. पुन्हा तपासा.</div>';
      }
    }
  );

  recaptchaWidgetId = await recaptchaVerifier.render();
}

async function resetRecaptcha(){
  try{
    if(recaptchaWidgetId !== null && window.grecaptcha){
      window.grecaptcha.reset(recaptchaWidgetId);
    }
  }catch(_){}
}

window.sendOTP = async function(){
  const phone = document.getElementById("phone").value.trim();
  const btn = document.getElementById("sendOtpBtn");
  const msg = document.getElementById("msg");

  if(!/^[0-9]{10}$/.test(phone)){
    msg.innerHTML =
      '<div class="error">कृपया 10 अंकी मोबाईल नंबर टाका.</div>';
    return;
  }

  btn.disabled = true;
  btn.textContent = "OTP पाठवत आहे...";

  msg.innerHTML =
    '<div class="info">reCAPTCHA तपासणी आणि OTP पाठवण्याची प्रक्रिया सुरू आहे...</div>';

  try{
    await makeRecaptcha();

    confirmationResult = await signInWithPhoneNumber(
      auth,
      "+91"+phone,
      recaptchaVerifier
    );

    document.getElementById("otpArea").classList.remove("hidden");

    msg.innerHTML =
      '<div class="success">✅ OTP पाठवला आहे. SMS मधील 6 अंकी OTP टाका.</div>';

  }catch(e){
    console.error("Firebase OTP error:", e);
    confirmationResult = null;

    await resetRecaptcha();

    msg.innerHTML =
      '<div class="error"><b>OTP पाठवता आला नाही.</b><br>'+
      firebaseErrorMessage(e)+
      '</div>';

  }finally{
    btn.disabled = false;
    btn.textContent = "OTP पाठवा";
  }
};

window.verifyOTP = async function(){
  const otp = document.getElementById("otp").value.trim();
  const msg = document.getElementById("msg");
  const btn = document.getElementById("verifyOtpBtn");

  if(!confirmationResult){
    msg.innerHTML =
      '<div class="error">आधी OTP पाठवा.</div>';
    return;
  }

  if(!/^[0-9]{6}$/.test(otp)){
    msg.innerHTML =
      '<div class="error">6 अंकी OTP टाका.</div>';
    return;
  }

  btn.disabled = true;
  btn.textContent = "तपासत आहे...";

  try{
    const result = await confirmationResult.confirm(otp);

    verifiedPhone = result.user.phoneNumber;

    document.getElementById("verified").classList.remove("hidden");
    document.getElementById("bookingFields").classList.remove("hidden");
    document.getElementById("otpArea").classList.add("hidden");
    document.getElementById("phone").disabled = true;
    document.getElementById("sendOtpBtn").classList.add("hidden");

    msg.innerHTML =
      '<div class="success">✅ मोबाईल नंबर यशस्वीपणे सत्यापित झाला.</div>';

  }catch(e){
    console.error("OTP verify error:", e);

    msg.innerHTML =
      '<div class="error">'+firebaseErrorMessage(e)+'</div>';

  }finally{
    btn.disabled = false;
    btn.textContent = "OTP तपासा";
  }
};

window.book = async function(){
  if(bookingInProgress) return;

  if(!verifiedPhone){
    alert("आधी मोबाईल OTP सत्यापित करा.");
    return;
  }

  const name = document.getElementById("name").value.trim();
  const service = document.getElementById("service").value;
  const selectedPlace = document.getElementById("place").value;
  const details = document.getElementById("details").value.trim();
  const btn = document.getElementById("bookBtn");

  if(!name || !selectedPlace || !details){
    alert("कृपया सर्व माहिती भरा.");
    return;
  }

  bookingInProgress = true;
  btn.disabled = true;
  btn.textContent = "बुकिंग होत आहे...";

  try{
    const userKey = auth.currentUser.uid;

    const existing = await get(
      query(
        ref(db,"bookings"),
        orderByChild("userId"),
        equalTo(userKey)
      )
    );

    let duplicate = false;

    if(existing.exists()){
      existing.forEach(s=>{
        const b = s.val();

        if(
          b.service === service &&
          b.place === selectedPlace &&
          b.details === details &&
          b.status === "नवीन"
        ){
          duplicate = true;
        }
      });
    }

    if(duplicate){
      document.getElementById("msg").innerHTML =
        '<div class="error">हीच बुकिंग आधीच नोंदलेली आहे.</div>';
      return;
    }

    const bookingRef = push(ref(db,"bookings"));
    const village = villages.find(v=>v[0]===selectedPlace);

    const booking = {
      id: bookingRef.key,
      userId: userKey,
      name: name,
      phone: verifiedPhone,
      service: service,
      place: selectedPlace,
      stop: villages.findIndex(v=>v[0]===selectedPlace)+1,
      distanceKm: village ? village[1] : null,
      details: details,
      status: "नवीन",
      createdAt: Date.now()
    };

    await set(bookingRef, booking);

    document.getElementById("msg").innerHTML =
      '<div class="success"><b>बुकिंग यशस्वी!</b><br>बुकिंग क्रमांक: '+
      booking.id+'</div>';

    document.getElementById("details").value = "";

    setTimeout(()=>{
      show("mybookings");
      render();
    },500);

  }catch(e){
    console.error("Booking error:", e);

    document.getElementById("msg").innerHTML =
      '<div class="error">बुकिंग सेव्ह झाली नाही.<br>'+
      firebaseErrorMessage(e)+'</div>';

  }finally{
    bookingInProgress = false;
    btn.disabled = false;
    btn.textContent = "बुकिंग करा";
  }
};

window.render = async function(){
  const list = document.getElementById("list");

  if(!auth.currentUser){
    list.innerHTML =
      "OTP सत्यापित केल्यानंतर तुमच्या बुकिंग दिसतील.";
    return;
  }

  list.innerHTML = "लोड होत आहे...";

  try{
    const snap = await get(
      query(
        ref(db,"bookings"),
        orderByChild("userId"),
        equalTo(auth.currentUser.uid)
      )
    );

    if(!snap.exists()){
      list.innerHTML = "अजून कोणतीही बुकिंग नाही.";
      return;
    }

    let arr = [];

    snap.forEach(s=>{
      arr.push(s.val());
    });

    arr.sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));

    list.innerHTML = arr.map(b=>
      `<div class="card">
        <b>बुकिंग: ${b.id}</b><br>
        सेवा: ${b.service}<br>
        स्टॉप ${b.stop}: ${b.place}
        ${b.distanceKm!==null && b.distanceKm!==undefined ? " — "+b.distanceKm+" km" : ""}<br>
        स्थिती: ${b.status}
      </div>`
    ).join("");

  }catch(e){
    console.error(e);

    list.innerHTML =
      '<div class="error">बुकिंग लोड करता आली नाही.</div>';
  }
};
</script>
</body>
</html>
